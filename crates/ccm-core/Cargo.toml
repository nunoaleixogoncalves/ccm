[package]
name = "ccm-core"
version = "0.1.0"
edition = "2024"
description = "The library behind ccm"
repository = "https://github.com/nunoaleixogoncalves/ccm"
license = "MIT"
publish = false

[dependencies]
chrono = "0.4.45"
libc = "0.2.191"
rayon = "1.12.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"
